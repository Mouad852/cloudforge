name: terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  # "Run workflow" button: brings dev back after the nightly destroy without
  # needing a commit. Runs the same gated applies as a push to main.
  workflow_dispatch: {}

permissions:
  contents: read

env:
  TF_VERSION: "1.11.4"
  AWS_REGION: "eu-west-3"

jobs:
  lint:
    name: fmt / tflint / checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive terraform/

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --chdir=terraform

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          skip_check: CKV_AWS_18,CKV_AWS_144,CKV_AWS_145,CKV2_AWS_62,CKV_AWS_382,CKV_AWS_126,CKV2_AWS_41,CKV_AWS_158,CKV_AWS_338,CKV_AWS_150,CKV_AWS_2,CKV2_AWS_20,CKV_AWS_103,CKV_AWS_21,CKV_AWS_378,CKV_AWS_260,CKV2_AWS_76,CKV2_AWS_31,CKV_AWS_157,CKV_AWS_293,CKV_AWS_354,CKV_AWS_118,CKV_AWS_149,CKV_AWS_191,CKV2_AWS_50,CKV2_AWS_57,CKV_SECRET_6,CKV2_AWS_61,CKV_AWS_394
          skip_framework: terraform_plan
          quiet: true

  plan:
    name: plan (${{ matrix.environment }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-terraform-plan-${{ matrix.environment }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -lock=false -input=false -no-color \
            -var="environment=${{ matrix.environment }}" \
            -var="alert_email=${{ vars.ALERT_EMAIL }}" \
            -out=tfplan 2>&1 | tee plan.txt
          EXITCODE=${PIPESTATUS[0]}
          set -e
          echo "exitcode=$EXITCODE" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: find previous comment
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- tfplan-${{ matrix.environment }} -->"

      - name: post plan as PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- tfplan-${{ matrix.environment }} -->
            ### Terraform plan — `${{ matrix.environment }}`
            ```
            ${{ steps.plan.outputs.stdout }}
            ```

      - name: fail if plan failed
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  infracost:
    name: infracost (${{ matrix.environment }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-infracost-${{ matrix.environment }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: infracost breakdown
        run: |
          infracost breakdown \
            --path=terraform/environments/${{ matrix.environment }} \
            --terraform-var="alert_email=${{ vars.ALERT_EMAIL }}" \
            --format=json \
            --out-file=infracost-${{ matrix.environment }}.json

      - name: post cost diff as PR comment
        run: |
          infracost comment github \
            --path=infracost-${{ matrix.environment }}.json \
            --repo=$GITHUB_REPOSITORY \
            --github-token=${{ secrets.GITHUB_TOKEN }} \
            --pull-request=${{ github.event.pull_request.number }} \
            --tag=${{ matrix.environment }} \
            --behavior=update

  test-readonly:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [cache, cicd-oidc, compute, database, edge, observability, storage]
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform/modules/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN || vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-test-${{ matrix.module }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false

      - name: terraform test
        run: terraform test

  test-network:
    name: test (network)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # network.tftest.hcl's route-table assertion is command = apply - the
    # only module test that launches a real EC2 instance. Without this,
    # overlapping pushes race for the account's default per-family vCPU
    # quota (hit this for real: VcpuLimitExceeded during a burst of pushes).
    concurrency:
      group: cloudforge-test-network
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform/modules/network
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-test-network
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false

      - name: terraform test
        run: terraform test

  apply-dev:
    name: apply (dev)
    if: github.event_name != 'pull_request'
    needs: [lint, test-readonly, test-network]
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: cloudforge-apply-dev
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-apply-dev
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Only used by ensure-artifact.sh, and only when the environment has no
      # binary yet. Set up before the apply so the upload follows it quickly.
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod

      - name: terraform init
        run: terraform init -input=false

      # The newest final snapshot is passed on every apply, but it only takes
      # effect when the database is being created (after the nightly destroy):
      # ignore_changes on the instance means a running database never sees it.
      - name: terraform apply
        run: |
          SNAP=$(aws rds describe-db-snapshots \
            --db-instance-identifier dev-cloudforge-db \
            --snapshot-type manual \
            --query "reverse(sort_by(DBSnapshots[?Status=='available'],&SnapshotCreateTime))[0].DBSnapshotIdentifier" \
            --output text)
          SNAP_ARGS=()
          if [ -n "$SNAP" ] && [ "$SNAP" != "None" ]; then
            echo "Restore source if the database is created: $SNAP"
            SNAP_ARGS=(-var="snapshot_identifier=$SNAP")
          fi
          terraform apply -auto-approve -input=false \
            -var="environment=dev" \
            -var="alert_email=${{ vars.ALERT_EMAIL }}" \
            "${SNAP_ARGS[@]}"

      - name: upload the app binary if the environment has none
        working-directory: ${{ github.workspace }}
        run: bash scripts/ensure-artifact.sh dev

  apply-prod:
    name: apply (prod)
    if: github.event_name != 'pull_request'
    needs: [apply-dev]
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: cloudforge-apply-prod
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform/environments/prod
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-apply-prod
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod

      - name: terraform init
        run: terraform init -input=false

      - name: terraform apply
        run: |
          terraform apply -auto-approve -input=false \
            -var="environment=prod" \
            -var="alert_email=${{ vars.ALERT_EMAIL }}"

      - name: upload the app binary if the environment has none
        working-directory: ${{ github.workspace }}
        run: bash scripts/ensure-artifact.sh prod
