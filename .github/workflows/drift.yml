name: drift

on:
  schedule:
    # 06:00 UTC daily. workflow_dispatch below covers ad-hoc runs to test
    # this workflow without waiting for the schedule.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  TF_VERSION: "1.11.4"
  AWS_REGION: "eu-west-3"

jobs:
  drift-check:
    name: drift check (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    concurrency:
      group: cloudforge-drift-${{ matrix.environment }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      issues: write
    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-drift-${{ matrix.environment }}
          aws-region: ${{ env.AWS_REGION }}

      # A missing resource alone never suppresses drift. A lifecycle operation records
      # an explicit repository variable only after it succeeds. "down" suppresses a
      # plan only when Terraform state is also empty; missing, stale or contradictory
      # values fail safe into normal drift detection or a visible workflow failure.
      - name: resolve expected lifecycle state
        id: lifecycle
        run: |
          if [ "${{ matrix.environment }}" = "dev" ]; then
            STATE="${{ vars.CLOUDFORGE_DEV_LIFECYCLE_STATE }}"
          else
            STATE="${{ vars.CLOUDFORGE_PROD_LIFECYCLE_STATE }}"
          fi
          case "$STATE" in
            down)
              echo "Expected lifecycle state: down; verifying empty Terraform state."
              echo "mode=verify-down" >> "$GITHUB_OUTPUT"
              ;;
            up)
              echo "Expected lifecycle state: up; running normal drift detection."
              echo "mode=plan" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Lifecycle state is missing or invalid; running normal drift detection." >&2
              echo "mode=plan" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false

      - name: verify intentional teardown has empty state
        id: teardown-state
        if: steps.lifecycle.outputs.mode == 'verify-down'
        run: |
          terraform state list > terraform-state.txt
          if [ -s terraform-state.txt ]; then
            echo "Lifecycle state says down, but Terraform state still tracks resources:" >&2
            sed -n '1,20p' terraform-state.txt >&2
            exit 1
          fi
          echo "Lifecycle state and Terraform state agree: environment is intentionally down."
        continue-on-error: true

      - name: open lifecycle-state inconsistency issue
        if: steps.teardown-state.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Environment lifecycle state inconsistent (${{ matrix.environment }})"
          {
            echo "The lifecycle signal says **${{ matrix.environment }}** is intentionally down, but Terraform state is not empty or could not be read."
            echo
            echo "Drift detection was not suppressed. Investigate the incomplete/stale lifecycle operation before changing the signal."
            echo
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > lifecycle-issue.md
          EXISTING_ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue comment "$EXISTING_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file lifecycle-issue.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file lifecycle-issue.md
          fi

      - name: fail on lifecycle-state inconsistency
        if: steps.teardown-state.outcome == 'failure'
        run: exit 1

      - name: terraform plan (detailed exit code)
        id: plan
        if: steps.lifecycle.outputs.mode == 'plan'
        run: |
          set +e
          terraform plan -detailed-exitcode -lock=false -input=false -no-color \
            -var="environment=${{ matrix.environment }}" \
            -var="alert_email=${{ vars.ALERT_EMAIL }}" \
            2>&1 | tee plan.txt
          EXITCODE=${PIPESTATUS[0]}
          set -e
          echo "exitcode=$EXITCODE" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: open or update drift issue
        if: steps.plan.outputs.exitcode == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Infrastructure drift detected (${{ matrix.environment }})"
          {
            echo "Terraform detected infrastructure drift in **${{ matrix.environment }}**."
            echo
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            head -c 60000 plan.txt
            echo
            echo '```'
          } > issue-body.md

          EXISTING_ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue comment "$EXISTING_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file issue-body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file issue-body.md
          fi

      - name: publish drift alert to SNS
        if: steps.plan.outputs.exitcode == '2'
        run: |
          TOPIC_ARN=$(terraform output -raw alerts_sns_topic_arn)
          aws sns publish \
            --topic-arn "$TOPIC_ARN" \
            --subject "Drift detected: ${{ matrix.environment }}" \
            --message "Terraform found infrastructure drift in ${{ matrix.environment }}. Issue: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues"

      - name: fail if plan errored
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

      # Backstop for the load-test window (PLAN.md §9, D2;
      # docs/runbooks/load-test-window.md). The WAF rate-limit exemption list
      # is managed outside Terraform on purpose, so the plan above never sees
      # its contents, and it must be empty outside a window.
      # scripts/waf-benchmark-window.sh empties it on every exit it can catch;
      # this catches the one it cannot (the load generator itself dying). It
      # reports a count only: issues are public, and the list would hold an
      # operator's address.
      - name: check the WAF rate-limit exemption list is empty
        if: always() && steps.lifecycle.outputs.mode == 'plan'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME="${{ matrix.environment }}-cloudforge-rate-limit-exempt"
          ID=$(aws wafv2 list-ip-sets --scope REGIONAL \
            --query "IPSets[?Name=='${NAME}'].Id | [0]" --output text)
          if [ -z "$ID" ] || [ "$ID" = "None" ]; then
            echo "${NAME} does not exist in ${{ matrix.environment }} - nothing to check"
            exit 0
          fi
          COUNT=$(aws wafv2 get-ip-set --scope REGIONAL --name "$NAME" --id "$ID" \
            --query "length(IPSet.Addresses)" --output text)
          echo "${NAME} holds ${COUNT} address(es)"
          if [ "$COUNT" = "0" ]; then
            exit 0
          fi

          TITLE="WAF rate-limit exemption left active (${{ matrix.environment }})"
          {
            echo "The WAF rate-limit exemption list \`${NAME}\` holds **${COUNT}** address(es) outside a load-test window."
            echo "Those sources bypass the per-IP rate limit (every other WAF rule still applies to them)."
            echo
            echo "Empty it now: \`scripts/waf-benchmark-window.sh ${{ matrix.environment }} --cleanup-only\`"
            echo "(docs/runbooks/load-test-window.md). The address is deliberately not shown here."
            echo
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > exemption-issue.md

          EXISTING_ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue comment "$EXISTING_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file exemption-issue.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file exemption-issue.md
          fi
          exit 1
