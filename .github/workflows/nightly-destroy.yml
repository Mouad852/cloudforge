name: nightly-destroy

on:
  schedule:
    # 23:00 UTC - backstop `terraform destroy` on dev for the night it's
    # forgotten. Mirrors `make dev-down`: destroy triggers an automatic final
    # RDS snapshot (ADR-015), so `make dev-up` can restore the data later -
    # this never actually throws work away, just pauses the bill.
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  TF_VERSION: "1.11.4"
  AWS_REGION: "eu-west-3"

jobs:
  destroy-dev:
    name: destroy (dev)
    runs-on: ubuntu-latest
    # No `environment: dev`: the dev environment requires a reviewer, so every
    # "nightly" destroy used to sit waiting for a click, and dev ran on when
    # nobody clicked. A scheduled run on main is trusted by the apply role
    # through its ref:refs/heads/main subject instead.
    #
    # No shared concurrency group with terraform.yml's apply-dev either: a
    # forgotten apply (dev) approval held that group for two days (2026-09-25
    # to 09-27) and blocked every destroy queued behind it. The S3 state lock
    # (use_lockfile) keeps an apply and this destroy from running at once, and
    # -lock-timeout below makes the destroy wait for a running apply to finish.
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-nightly-destroy-dev
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false

      - name: terraform destroy
        run: |
          terraform destroy -auto-approve -input=false -lock-timeout=20m \
            -var="environment=dev" \
            -var="alert_email=${{ vars.ALERT_EMAIL }}"

      # The canary's Lambda creates its own log group, named with an ID that
      # Synthetics generates on every rebuild, so Terraform cannot create it
      # first and destroy leaves one behind each night (six by 2026-09-30,
      # docs/security/data-classification.md D3). Once dev is destroyed, none of
      # these groups belongs to anything.
      - name: delete the destroyed canary's log groups
        run: |
          for group in $(aws logs describe-log-groups \
              --log-group-name-prefix /aws/lambda/cwsyn-dev-api-avail- \
              --query "logGroups[].logGroupName" --output text); do
            echo "deleting $group"
            aws logs delete-log-group --log-group-name "$group"
          done
