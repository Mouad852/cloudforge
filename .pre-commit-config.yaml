repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.4
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        files: ^terraform/
      - id: terraform_tflint
        files: ^terraform/
      - id: terraform_checkov
        files: ^terraform/
        args:
          - --hook-config=--skip-framework=terraform_plan
          # Inline #checkov:skip= comments don't work in this checkov install
          # (verified: even a minimal isolated resource with a skip comment
          # still reports FAILED, Skipped checks: 0) - using --skip-check
          # instead. See the comment block above each affected resource in
          # terraform/bootstrap/main.tf for the per-check reasoning.
          - --args=--skip-check=CKV_AWS_18,CKV_AWS_144,CKV_AWS_145,CKV2_AWS_62
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
