repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.4
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        files: ^terraform/
        # edge declares a required provider alias (aws.use1, for the
        # CloudFront/WAF resources that must live in us-east-1) that only
        # resolves when a real root module supplies it - which
        # environments/dev does. Validated standalone, as this hook does
        # per-directory, there's no caller to supply it, so it always
        # fails here regardless of whether the config is actually correct.
        exclude: ^terraform/modules/edge/
      - id: terraform_tflint
        files: ^terraform/
      - id: terraform_checkov
        files: ^terraform/
        args:
          - --hook-config=--skip-framework=terraform_plan
          # Inline #checkov:skip= comments don't work in this checkov install
          # (verified: even a minimal isolated resource with a skip comment
          # still reports FAILED, Skipped checks: 0) - using --skip-check
          # instead. See the comment block above each affected resource in
          # terraform/bootstrap/main.tf and this file's own comments for the
          # per-check reasoning.
          #
          # CKV_AWS_18/144/145/CKV2_AWS_62: terraform/bootstrap state bucket
          #   (access logging, replication, KMS, event notifications - see
          #   terraform/bootstrap/main.tf).
          # CKV_AWS_382: NAT instance security group egress to 0.0.0.0/0 - its
          #   entire job is forwarding traffic to arbitrary internet
          #   destinations, so this rule is required, not a mistake.
          # CKV_AWS_126: EC2 detailed monitoring costs extra per-metric, not
          #   worth it for a throwaway dev NAT instance.
          # CKV2_AWS_41: NAT instance never calls an AWS API, so an IAM role
          #   would be an unused artifact added only to satisfy the check.
          # CKV_AWS_158: VPC flow log group - same call as CKV_AWS_145 above,
          #   CloudWatch Logs are already encrypted with an AWS-managed key;
          #   a customer KMS key adds ~$1/mo for marginal gain here.
          # CKV_AWS_338: VPC flow log group - this exists for debugging a
          #   dev VPC that's ephemeral by design (ADR-012), not a compliance
          #   audit trail; paying to store a year of logs for an environment
          #   that gets torn down is wasted cost.
          # CKV_AWS_305/CKV_AWS_310: CloudFront distribution - this is a pure
          #   API front end with no static content to serve as a default
          #   root object, and it has exactly one origin by design until M6
          #   adds the S3 origin (ADR-010) - an origin failover group has
          #   nothing to fail over to yet.
          # CKV_AWS_374: geo restriction is deliberately "none" - this is a
          #   public demo API, not something with a legal reason to block
          #   countries.
          # CKV_AWS_174/CKV2_AWS_42: the free *.cloudfront.net default
          #   certificate is the whole point of ADR-011 (no custom domain,
          #   free HTTPS with zero maintenance) - it is hard-locked to
          #   TLSv1 as its minimum and cannot use a custom cert. Accepting
          #   that floor is the ADR's actual trade-off, not an oversight.
          # CKV2_AWS_47: checkov can't trace that web_acl_id points at a Web
          #   ACL that already includes AWSManagedRulesKnownBadInputsRuleSet
          #   (Log4j coverage) - verified directly in this file, the rule
          #   group is there and the ACL is attached.
          # CKV_AWS_86/CKV2_AWS_31: CloudFront access logging (legacy method)
          #   requires enabling ACLs on the log bucket, which conflicts with
          #   the ACL-disabled, policy-only bucket already standardized on
          #   for cost/security consistency across this project; WAF's own
          #   sampled requests (already on for every rule) give enough
          #   visibility for a dev environment.
          # CKV_AWS_157/CKV_AWS_293: RDS Multi-AZ and deletion protection are
          #   both deliberately environment-driven variables (PLAN.md M5) -
          #   on in prod, off in dev so a throwaway dev DB can actually be
          #   destroyed and doesn't pay for a standby replica it doesn't need.
          # CKV_AWS_354: Performance Insights uses the default AWS-managed
          #   key rather than a customer-managed KMS key - same cost-vs-
          #   marginal-benefit call already made for CloudWatch Logs
          #   elsewhere in this project (CKV_AWS_158), applied consistently.
          # CKV_AWS_118: Enhanced Monitoring needs its own IAM role and adds
          #   OS-level metrics on top of Performance Insights (already on,
          #   CKV_AWS_353) - query-level visibility already covers what
          #   this dev database actually needs to debug.
          - --args=--skip-check=CKV_AWS_18,CKV_AWS_144,CKV_AWS_145,CKV2_AWS_62,CKV_AWS_382,CKV_AWS_126,CKV2_AWS_41,CKV_AWS_158,CKV_AWS_338,CKV_AWS_150,CKV_AWS_2,CKV2_AWS_20,CKV_AWS_103,CKV2_AWS_28,CKV_AWS_21,CKV_AWS_378,CKV_AWS_305,CKV_AWS_310,CKV_AWS_374,CKV_AWS_174,CKV2_AWS_42,CKV2_AWS_47,CKV_AWS_86,CKV2_AWS_31,CKV_AWS_157,CKV_AWS_293,CKV_AWS_354,CKV_AWS_118
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
