repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.4
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        files: ^terraform/
        # edge and observability both declare a required provider alias
        # (aws.use1 - edge for CloudFront/WAF, observability for the
        # AWS/Billing alarm, both of which must live in us-east-1) that only
        # resolves when a real root module supplies it - which
        # environments/dev does. Validated standalone, as this hook does
        # per-directory, there's no caller to supply it, so it always
        # fails here regardless of whether the config is actually correct.
        exclude: ^terraform/modules/(edge|observability)/
      - id: terraform_tflint
        files: ^terraform/
      - id: terraform_checkov
        files: ^terraform/
        args:
          - --hook-config=--skip-framework=terraform_plan
          # Inline #checkov:skip= comments don't work in this checkov install
          # (verified: even a minimal isolated resource with a skip comment
          # still reports FAILED, Skipped checks: 0) - using --skip-check
          # instead. See the comment block above each affected resource in
          # terraform/bootstrap/main.tf and this file's own comments for the
          # per-check reasoning.
          #
          # CKV_AWS_18/144/145/CKV2_AWS_62: terraform/bootstrap state bucket
          #   (access logging, replication, KMS, event notifications - see
          #   terraform/bootstrap/main.tf).
          # CKV_AWS_382: NAT instance security group egress to 0.0.0.0/0 - its
          #   entire job is forwarding traffic to arbitrary internet
          #   destinations, so this rule is required, not a mistake.
          # CKV_AWS_126: EC2 detailed monitoring costs extra per-metric, not
          #   worth it for a throwaway dev NAT instance.
          # CKV2_AWS_41: NAT instance never calls an AWS API, so an IAM role
          #   would be an unused artifact added only to satisfy the check.
          # CKV_AWS_158: VPC flow log group - same call as CKV_AWS_145 above,
          #   CloudWatch Logs are already encrypted with an AWS-managed key;
          #   a customer KMS key adds ~$1/mo for marginal gain here.
          # CKV_AWS_338: VPC flow log group - this exists for debugging a
          #   dev VPC that's ephemeral by design (ADR-012), not a compliance
          #   audit trail; paying to store a year of logs for an environment
          #   that gets torn down is wasted cost.
          # CKV_AWS_150/CKV_AWS_2/CKV2_AWS_20/CKV_AWS_103/CKV_AWS_378: the ALB
          #   has no HTTPS listener - ADR-025 (CloudFront access was
          #   permanently denied by AWS Support, so the ALB became the
          #   public edge itself) accepted HTTP-only rather than buy a
          #   domain for an ACM certificate, reopening the recurring cost
          #   ADR-011 already avoided once. CKV_AWS_150 (ALB deletion
          #   protection) is unrelated to that - it's a variable, off in
          #   dev and on in prod (PLAN.md M9), so it's only ever "failing"
          #   against dev's own deliberate default.
          # CKV_AWS_260: the ALB security group's ingress is 0.0.0.0/0 on
          #   port 80 by design (ADR-025) - with no CloudFront in front of
          #   it, the ALB is the public edge, the same way any internet-
          #   facing ALB with no CDN works. The WAF web ACL is associated
          #   directly with it.
          # CKV_AWS_21: the ALB access-log bucket has no versioning - access
          #   logs are write-once objects nothing ever updates in place, so
          #   there is no prior version to protect.
          # CKV2_AWS_76: checkov can't trace that the ALB's associated web
          #   ACL already includes AWSManagedRulesKnownBadInputsRuleSet (Log4j
          #   coverage) - verified directly in modules/edge/main.tf, the rule
          #   group is there and aws_wafv2_web_acl_association attaches it.
          #   Same graph-tracing limitation the old CloudFront-scoped check
          #   (CKV2_AWS_47, retired with ADR-025) already had.
          # CKV2_AWS_31: the WAF web ACL has no logging configuration
          #   (aws_wafv2_web_acl_logging_configuration) - that needs a
          #   separate log destination (Kinesis Data Firehose or CloudWatch
          #   Logs) to set up and pay for. The web ACL's own sampled requests
          #   and per-rule CloudWatch metrics (already on for every rule)
          #   give enough visibility for a dev environment.
          # CKV_AWS_157/CKV_AWS_293: RDS Multi-AZ and deletion protection are
          #   both deliberately environment-driven variables (PLAN.md M5) -
          #   on in prod, off in dev so a throwaway dev DB can actually be
          #   destroyed and doesn't pay for a standby replica it doesn't need.
          # CKV_AWS_354: Performance Insights uses the default AWS-managed
          #   key rather than a customer-managed KMS key - same cost-vs-
          #   marginal-benefit call already made for CloudWatch Logs
          #   elsewhere in this project (CKV_AWS_158), applied consistently.
          # CKV_AWS_118: Enhanced Monitoring needs its own IAM role and adds
          #   OS-level metrics on top of Performance Insights (already on,
          #   CKV_AWS_353) - query-level visibility already covers what
          #   this dev database actually needs to debug.
          # CKV_AWS_149/CKV_AWS_191: Secrets Manager secret and ElastiCache
          #   replication group both use the default AWS-managed key rather
          #   than a customer-managed KMS key - same cost-vs-marginal-benefit
          #   call already made for CloudWatch Logs and Performance Insights
          #   elsewhere in this project (CKV_AWS_158, CKV_AWS_354).
          # CKV2_AWS_50: single-node dev cache (num_cache_clusters = 1, M6) -
          #   automatic failover has no second node to fail over to; prod
          #   would need num_cache_clusters >= 2 first.
          # CKV2_AWS_57: Redis AUTH token has no automatic rotation - unlike
          #   the RDS master password (manage_master_user_password, ADR-009),
          #   ElastiCache has no built-in rotation; a custom rotation Lambda
          #   is real added complexity out of scope for M6's dev cache.
          # CKV_SECRET_6: checkov's own "high entropy string" heuristic keeps
          #   flagging modules/cache/tests/cache.tftest.hcl's fake AUTH token fixture
          #   regardless of its actual content - it appears to key off the
          #   surrounding "auth_token ==" pattern more than real entropy.
          #   gitleaks (below, a dedicated secret scanner) remains active and
          #   is the real defense against an actually-committed secret.
          # CKV2_AWS_61: images bucket (M6) has no lifecycle rule, unlike the
          #   artifacts bucket - artifacts are deploy binaries that pile up
          #   with no lasting value past 90 days; images are actual product
          #   content the app serves, where auto-expiring old versions risks
          #   silently deleting something a customer still references. Worth
          #   the extra storage cost to not do that automatically.
          # CKV_AWS_394: network module's aws_availability_zones data source
          #   intentionally queries all AZs and slices the first two - that's
          #   what lets the module work in any region without hardcoding AZ
          #   names; pinning specific zone IDs would trade away that
          #   portability for no real security benefit here.
          - --args=--skip-check=CKV_AWS_18,CKV_AWS_144,CKV_AWS_145,CKV2_AWS_62,CKV_AWS_382,CKV_AWS_126,CKV2_AWS_41,CKV_AWS_158,CKV_AWS_338,CKV_AWS_150,CKV_AWS_2,CKV2_AWS_20,CKV_AWS_103,CKV_AWS_21,CKV_AWS_378,CKV_AWS_260,CKV2_AWS_76,CKV2_AWS_31,CKV_AWS_157,CKV_AWS_293,CKV_AWS_354,CKV_AWS_118,CKV_AWS_149,CKV_AWS_191,CKV2_AWS_50,CKV2_AWS_57,CKV_SECRET_6,CKV2_AWS_61,CKV_AWS_394
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
